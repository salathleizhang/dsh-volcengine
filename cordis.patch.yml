            name: Doubao-Seed-2.1-Pro
            contextWindow: 256000
            input: [text, image]
          - id: doubao-seed-2-1-turbo-260628
            name: Doubao-Seed-2.1-Turbo
            contextWindow: 256000
            input: [text, image]
          - id: doubao-seed-evolving
